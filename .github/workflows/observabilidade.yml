name: Observabilidade

# Portão dos SLOs (US-13). Um SLO que só existe em prosa não alerta ninguém —
# aqui a CI garante que:
#   1. as regras do Prometheus batem com docs/observabilidade/slos.yaml;
#   2. as regras são sintaticamente válidas (promtool check);
#   3. a queima de orçamento dispara no cenário certo e não dispara no ruído
#      (promtool test);
#   4. a configuração do Alertmanager é válida (amtool check-config).

on:
  pull_request:
    paths:
      - "docs/observabilidade/**"
      - "tools/observabilidade/**"
      - "app/services/prometheus/**"
      - "app/services/alertmanager/**"
      - ".github/workflows/observabilidade.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROM_IMAGE: prom/prometheus:v2.53.0
  AM_IMAGE: prom/alertmanager:v0.27.0

jobs:
  slos:
    name: Regras de SLO e alertas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regras geradas em sincronia com o slos.yaml
        run: |
          pip install pyyaml pytest
          python tools/observabilidade/gerar_alertas.py --check
          pytest tools/observabilidade/ -q

      - name: Regras válidas (promtool check)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/app/services/prometheus:/p" "$PROM_IMAGE" \
            check rules /p/rules/slo-burn-rate.yml

      - name: Comportamento da queima de orçamento (promtool test)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/app/services/prometheus:/p" "$PROM_IMAGE" \
            test rules /p/rules/tests/slo-burn-rate.test.yml

      - name: Configuração do Alertmanager válida
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/app/services/alertmanager:/a" "$AM_IMAGE" \
            check-config /a/alertmanager.yml
