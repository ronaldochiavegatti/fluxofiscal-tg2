# Overlay de deploy na VPS (Hostinger KVM 2). Não altera o compose de dev:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.deploy.yml up -d --build
#
# (o instalar.sh grava COMPOSE_FILE no .env, então basta `docker compose ...`).
#
# O que muda em relação ao dev:
#   - Só o Caddy (80/443) fica exposto à internet, com HTTPS.
#   - Unleash, MinIO e Prometheus ficam presos em 127.0.0.1 (acesso via túnel
#     SSH). O Docker ignora o ufw, então fechar a porta aqui é o que vale.
#   - Frontend vira build estático (nginx), apontando para o domínio público.
#   - Unleash ganha um token de admin para o seed das flags.

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN no .env}
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api-gateway

  frontend:
    build:
      context: ./services/frontend
      dockerfile: ../../deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}
        VITE_UNLEASH_FRONTEND_URL: https://${API_DOMAIN}/unleash-frontend
        VITE_UNLEASH_FRONTEND_TOKEN: ${UNLEASH_FRONTEND_TOKEN}
        VITE_UNLEASH_APP_NAME: ${UNLEASH_APP_NAME:-fluxofiscal}
    restart: unless-stopped
    ports: !reset []

  api-gateway:
    restart: unless-stopped
    ports: !reset []

  unleash:
    restart: unless-stopped
    environment:
      INIT_ADMIN_API_TOKENS: ${UNLEASH_ADMIN_TOKEN:?defina UNLEASH_ADMIN_TOKEN no .env}
    ports: !override
      - "127.0.0.1:4242:4242"

  minio:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9001:9001"

  prometheus:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9090:9090"

  # Reinício automático se a VPS reiniciar.
  auth: { restart: unless-stopped }
  auth_db: { restart: unless-stopped }
  billing: { restart: unless-stopped }
  billing_db: { restart: unless-stopped }
  documents: { restart: unless-stopped }
  limits: { restart: unless-stopped }
  limits_db: { restart: unless-stopped }
  agent: { restart: unless-stopped }
  agent_db: { restart: unless-stopped }
  unleash_db: { restart: unless-stopped }
  redis: { restart: unless-stopped }
  mongo: { restart: unless-stopped }
  insights: { restart: unless-stopped }
  insights_db: { restart: unless-stopped }
  worker: { restart: unless-stopped }
  notifications: { restart: unless-stopped }
  notifications_db: { restart: unless-stopped }

volumes:
  caddy_data:
  caddy_config:
