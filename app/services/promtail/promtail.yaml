# Promtail — coleta os logs JSON dos contêineres e envia ao Loki (US-12).
#
# Os serviços já emitem uma linha JSON por evento no stdout (US-09), com
# trace_id. O Promtail só transporta; a extração do trace_id para o salto
# log -> rastro acontece no Grafana, via derivedFields do datasource Loki,
# para não transformar o trace_id em rótulo de alta cardinalidade.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "servico"
