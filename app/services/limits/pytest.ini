[pytest]
# A CI executa `pytest tests/` com o diretório do serviço como raiz. Sem
# pythonpath, o pytest insere apenas `tests/` no sys.path e o import de
# `app.dominio` falha.
pythonpath = .
testpaths = tests
addopts = --strict-markers --strict-config -q

markers =
    integracao: sobe um PostgreSQL 16 real via testcontainers (exige Docker)
    contrato: exercita o serviço contra o OpenAPI que ele mesmo publica

filterwarnings =
    error
    # Aviso do reportlab ao inspecionar a própria árvore sintática na
    # importação. Vem de dentro da biblioteca, não do nosso código.
    ignore:ast.NameConstant is deprecated:DeprecationWarning
    # O Schemathesis 3.x ainda usa a API de resolução de referências que a
    # jsonschema depreciou na 4.18. Aviso de terceiro, entre duas bibliotecas
    # que não são nossas; some quando o Schemathesis migrar para `referencing`.
    ignore:jsonschema:DeprecationWarning
    # SQLite não tem tipo decimal nativo e o SQLAlchemy avisa que converte via
    # float. É justamente por isso que os totais também são exercitados contra
    # PostgreSQL em tests/test_integracao_postgres.py.
    ignore:Dialect sqlite:
