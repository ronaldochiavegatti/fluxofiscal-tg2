# Datasources do Grafana provisionados como código (US-10, US-12).
# Painel construído a mão na interface se perde; este arquivo é a fonte.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Salto rastro -> log: de um span para as linhas de log daquela requisição.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{container=~".+"} |= "${__span.traceId}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Salto log -> rastro: extrai o trace_id da linha JSON em tempo de
      # consulta e vira um link para o Tempo.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"([a-f0-9]+)"'
          url: "${__value.raw}"
          datasourceUid: tempo
