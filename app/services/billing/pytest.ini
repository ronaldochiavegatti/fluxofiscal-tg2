[pytest]
# A CI executa `pytest tests/` com o diretório do serviço como raiz. Sem
# pythonpath, o pytest insere apenas `tests/` no sys.path e o import de `app`
# falha.
pythonpath = .
testpaths = tests
addopts = --strict-markers --strict-config -q

markers =
    contrato: exercita o serviço contra o OpenAPI que ele mesmo publica

filterwarnings =
    error
    # O Schemathesis 3.x ainda usa a API de resolução de referências que a
    # jsonschema depreciou na 4.18. Aviso de terceiro, entre duas bibliotecas
    # que não são nossas; some quando o Schemathesis migrar para `referencing`.
    ignore:jsonschema:DeprecationWarning
