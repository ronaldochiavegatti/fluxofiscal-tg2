server {
    listen 80;

    # Liveness do próprio gateway, sem depender de upstream. Cada serviço tem
    # o seu healthcheck, e o Compose já exige que todos estejam saudáveis antes
    # de iniciar o gateway; misturar as duas coisas faria uma indisponibilidade
    # de serviço aparecer como falha do gateway.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location / {
        return 200 "API Gateway up\n";
        add_header Content-Type text/plain;
    }

    proxy_set_header X-Correlation-Id $request_id;
    add_header X-Correlation-Id $request_id;

    location /auth/ {
        proxy_pass http://auth:8000/;
    }

    location /billing/ {
        proxy_pass http://billing:8000/;
    }

    location /documents/ {
        proxy_pass http://documents:8000/;
        # O /upload síncrono roda OCR + Gemini; com a CPU do Docker disputada,
        # passa dos 60 s padrão e o NGINX devolvia 504 sem CORS ("Failed to fetch").
        proxy_read_timeout 120s;
    }

    location /limits/ {
        proxy_pass http://limits:8000/;
    }

    location /agent/ {
        proxy_pass http://agent:8000/;
    }

    location /insights/ {
        proxy_pass http://insights:8000/;
    }

    location /notifications/ {
        proxy_pass http://notifications:8000/;
    }

    # Frontend API do Unleash (US-15), para o SDK do navegador — nunca fala
    # direto com o Unleash, só através daqui. `resolver` + variável adiam a
    # resolução de DNS para o momento da requisição: o gateway não declara
    # depends_on em unleash (ADR-0008), então na subida ele pode ainda não
    # existir na rede; com proxy_pass estático o nginx falharia ao iniciar.
    resolver 127.0.0.11 valid=10s;
    location /unleash-frontend/ {
        set $unleash_upstream http://unleash:4242;
        proxy_pass $unleash_upstream/api/frontend/;
    }
    # O SDK do navegador chama a raiz sem barra final. Sem esta rota exata o
    # nginx responde 301 para `/unleash-frontend/`, e o preflight CORS não
    # segue redirecionamento — as flags do frontend nunca carregavam.
    location = /unleash-frontend {
        set $unleash_upstream http://unleash:4242;
        proxy_pass $unleash_upstream/api/frontend$is_args$args;
    }
}
