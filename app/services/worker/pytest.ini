[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers --strict-config -q

filterwarnings =
    error
    # A instrumentação de Celery do OpenTelemetry ainda importa `pkg_resources`,
    # removido do setuptools recente. Aviso de terceiro, na importação.
    ignore:pkg_resources is deprecated:DeprecationWarning
    ignore:Deprecated call to `pkg_resources:DeprecationWarning
    # O plugin de pytest do Schemathesis (vem no requirements-dev compartilhado)
    # carrega `jsonschema` de forma tardia em todo teste; o jsonschema 4.18+
    # depreciou `RefResolutionError`. O worker não tem teste de contrato, mas o
    # plugin ativa mesmo assim. Aviso entre bibliotecas de terceiros.
    ignore:jsonschema:DeprecationWarning
    ignore:.*RefResolutionError is deprecated.*:DeprecationWarning
