# Prometheus — configuração de coleta e alertas para o FluxoFiscal (US-10, US-13)
#
# Cada serviço FastAPI expõe GET /metrics com métricas RED geradas pelo
# prometheus-fastapi-instrumentator. O Prometheus raspa cada um diretamente
# pela rede interna do Docker Compose.
#
# As regras de SLO em rules/ são GERADAS a partir de docs/observabilidade/slos.yaml
# por tools/observabilidade/gerar_alertas.py — não edite à mão.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# O Alertmanager só sobe com o overlay docker-compose.observability.yml. Sem
# ele, as regras continuam sendo avaliadas e visíveis em /alerts; só não há
# roteamento de notificação.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "auth"
    static_configs:
      - targets: ["auth:8000"]
    metrics_path: /metrics

  - job_name: "billing"
    static_configs:
      - targets: ["billing:8000"]
    metrics_path: /metrics

  - job_name: "limits"
    static_configs:
      - targets: ["limits:8000"]
    metrics_path: /metrics

  - job_name: "documents"
    static_configs:
      - targets: ["documents:8000"]
    metrics_path: /metrics

  - job_name: "agent-orchestrator"
    static_configs:
      - targets: ["agent:8000"]
    metrics_path: /metrics

  - job_name: "insights"
    static_configs:
      - targets: ["insights:8000"]
    metrics_path: /metrics

  - job_name: "notifications"
    static_configs:
      - targets: ["notifications:8000"]
    metrics_path: /metrics
